version: "1.0"
benchmark_id: "etsidi-six-technology-physical-model-benchmark-v1.0"
random_seed: 20261006
timezone: "Europe/Madrid"
raw_sources:
  electrical_zip: "../_drive_cache/PV_electrical_all.zip"
  weather_zip: "../_drive_cache/weather_companion.zip"
  local_system_reference_pdf: "../tmp/pdfs/TFM_ANTONIO_GARCIA_HORTELANO.pdf"
output_dir: "outputs/etsidi_physical_benchmark_v1_0"
figure_dir: "figures/etsidi_physical_benchmark_v1_0"
dataset:
  frequency: "5min"
  poa_column: "Pinc"
  ambient_temperature_column: "temp"
  wind_speed_column: "ws"
  daylight_poa_min_wm2: 20.0
  poa_valid_range_wm2: [-10.0, 1400.0]
  ambient_temperature_valid_range_c: [-25.0, 60.0]
  wind_speed_valid_range_ms: [0.0, 40.0]
  dc_voltage_valid_range_v: [0.0, 400.0]
  ac_voltage_valid_range_v: [180.0, 270.0]
split:
  unit: "local_calendar_day"
  stratification: "calendar_month"
  calibration_fraction: 0.60
  validation_fraction: 0.20
  test_fraction: 0.20
thermal_model:
  name: "Faiman"
  u0_bounds_wm2k: [1.0, 100.0]
  u1_bounds_wsm3k: [0.0, 50.0]
  objective: "robust least-squares on calibration rows"
  no_sensor_policy: "T1-S4 receives the median calibrated U0/U1 of the five instrumented systems"
dc_model:
  name: "De Soto five-parameter single diode"
  parameter_extraction: "NREL SAM/CEC six-parameter fit from locked datasheet values"
  poa_as_effective_irradiance: true
  scalar_loss_bounds: [0.0, 1.0]
  scalar_loss_fit: "closed-form least-squares retention factor on calibration rows"
inverter_model:
  name: "PVWatts"
  model: "SMA Sunny Boy 1200"
  pac0_w: 1200.0
  eta_nom: 0.921
  eta_ref: 0.9637
  pdc0_w: 1302.931596091205
  vdc_mpp_range_v: [100.0, 320.0]
  vdc_max_v: 400.0
  idc_max_a: 12.6

# STC and temperature coefficients are locked before looking at benchmark outcomes.
# alpha_sc and beta_voc are absolute A/K and V/K. gamma_pmp is %/K.
