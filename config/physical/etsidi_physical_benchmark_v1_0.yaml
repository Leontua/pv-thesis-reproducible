  T1_S1:
    display_id: "T1-S1"
    technology: "mc-Si"
    manufacturer: "LG Electronics"
    module_model: "LG250S1C-G2"
    module_year: 2012
    modules_series: 5
    strings_parallel: 1
    dc_current_measurement_multiplier: 1
    nominal_array_w: 1250.0
    cells_in_series: 60
    celltype_sam: "monoSi"
    pmp_w: 250.0
    vmp_v: 29.9
    imp_a: 8.37
